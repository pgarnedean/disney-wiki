<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disney Wiki - Royal Magical Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --disney-blue: #1e366e;
            --disney-gold: #c5a059;
            --bg-color: #f4f5f7;
            --sidebar-bg: #fbfbfb;
        }

        body { 
            font-family: 'Noto Serif JP', serif; 
            background-color: var(--bg-color); 
            margin: 0; 
            color: #202122; 
            position: relative; 
            overflow-x: hidden; 
        }
        
        /* モーダル表示中に背景スクロールを止めるクラス */
        body.noscroll { overflow: hidden; }

        /* --- 演出関連 --- */
        #effects-canvas, #fireworks-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
        }
        #effects-canvas { z-index: 9990; }
        #fireworks-canvas { z-index: 9995; }

        /* UIコンポーネント */
        header {
            background: linear-gradient(135deg, var(--disney-blue), #0d1b38);
            color: white; padding: 10px 30px; border-bottom: 3px solid var(--disney-gold);
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000;
        }
        
        .logo-container {
            display: flex; align-items: center; gap: 10px; cursor: pointer;
            text-decoration: none;
        }
        .logo-img { height: 45px; display: block; filter: brightness(0) invert(1); }

        .search-container { position: relative; width: 300px; }
        .search-box { position: relative; display: flex; align-items: center; }
        .search-box i { position: absolute; left: 12px; color: var(--disney-blue); }
        .search-box input { width: 100%; padding: 8px 10px 8px 35px; border-radius: 20px; border: 1px solid var(--disney-gold); outline: none; }
        .search-results {
            position: absolute; top: 40px; left: 0; width: 100%; background: white;
            border: 1px solid var(--disney-gold); border-radius: 5px; z-index: 1001; display: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .search-item { padding: 10px; color: #333; cursor: pointer; border-bottom: 1px solid #eee; }
        .search-item:hover { background: #f0f0f0; }

        .wrapper { display: flex; max-width: 1400px; margin: 20px auto; background: white; min-height: 90vh; box-shadow: 0 0 20px rgba(0,0,0,0.1); position: relative; z-index: 1; }
        .sidebar { width: 280px; padding: 20px; background: var(--sidebar-bg); border-right: 1px solid #eee; }
        .main-content { flex: 1; padding: 40px; box-sizing: border-box; }

        /* コンテンツスタイル */
        .page-header { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid #aaa; margin-bottom: 20px; padding-bottom: 10px; }
        .intro-container { display: flex; gap: 30px; margin-bottom: 30px; align-items: flex-start; }
        .fixed-summary { flex: 1; font-size: 1.1em; line-height: 1.8; white-space: pre-wrap; word-break: break-all; }
        .infobox { width: 320px; border: 1px solid #aaa; background: #fff; padding: 5px; font-size: 90%; flex-shrink: 0; }
        .infobox-head { background: var(--disney-blue); color: white; text-align: center; padding: 10px; font-weight: bold; }
        .infobox img { width: 100%; border-bottom: 1px solid #eee; }
        .infobox table { width: 100%; border-collapse: collapse; }
        .infobox th { background: #f2f2f2; text-align: left; padding: 8px; width: 35%; border-bottom: 1px solid #eee; }
        .infobox td { padding: 8px; border-bottom: 1px solid #eee; }

        /* コンテンツブロック */
        .content-block { margin-bottom: 30px; }
        h2 { border-bottom: 1px solid #aaa; color: var(--disney-blue); margin-top: 40px; padding-bottom: 5px; font-size: 1.8em; clear: both; }
        h3 { color: var(--disney-blue); margin-top: 25px; font-size: 1.4em; border-bottom: 1px dashed #ccc; }

        .media-box { 
            border: 1px solid #ccc; 
            background: #fafafa; padding: 15px; text-align: center; 
            cursor: pointer; transition: 0.2s; max-width: 100%; 
            border-radius: 4px;
        }
        .media-box:hover { box-shadow: 0 0 10px rgba(0,0,0,0.1); transform: translateY(-2px); }
        .media-preview-img { max-width: 100%; max-height: 300px; object-fit: contain; }
        .media-title { font-weight: bold; font-size: 0.9em; margin-bottom: 5px; color: var(--disney-blue); }
        .media-caption { font-size: 0.85em; color: #666; margin-top: 10px; line-height: 1.5; text-align: left; }
        
        .timeline-box, .wiki-table-container { 
            border: 2px solid var(--disney-gold); 
            padding: 15px; 
            background: white; 
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .timeline-row { display: flex; border-bottom: 1px dashed #eee; padding: 8px 0; }
        .tl-year { width: 80px; font-weight: bold; color: var(--disney-blue); flex-shrink: 0; text-align: right; padding-right: 15px; border-right: 2px solid var(--disney-gold); }
        .tl-event { padding-left: 15px; flex: 1; text-align: left; font-size: 0.95em; }

        .wiki-table { width: 100%; border-collapse: collapse; font-size: 14px; background: white; }
        .wiki-table th, .wiki-table td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        .wiki-table th { background: #f0f0f0; font-weight: bold; text-align: center; }

        /* --- モーダル（メディアビューア） --- */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9);
            z-index: 99999; display: flex; justify-content: center; align-items: center; 
            opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .modal.active { opacity: 1; pointer-events: auto; }
        
        .modal-container {
            width: 100%; height: 100%; position: relative; 
            overflow: hidden; /* 画像があるところまでしかスクロールできないように制限 */
            display: flex; justify-content: center; align-items: center;
        }

        .modal-content-wrapper {
            position: relative;
            transform-origin: center center;
            transition: transform 0.1s ease-out; 
            user-select: none;
            display: inline-block;
        }
        
        .modal-close { 
            position: absolute; top: 20px; right: 30px; color: white; font-size: 40px; 
            cursor: pointer; z-index: 10010; text-shadow: 0 0 5px black; 
        }

        .view-media { display: block; max-width: 90vw; max-height: 90vh; box-shadow: 0 0 20px rgba(0,0,0,0.5); pointer-events: none; }
        .pdf-frame { width: 80vw; height: 90vh; background: white; border: none; pointer-events: auto; }
        .video-frame { max-width: 90vw; max-height: 90vh; pointer-events: auto; }
        
        /* マーカー関連 */
        .marker-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; }
        .marker-layer.editing { cursor: crosshair; }
        .img-marker {
            position: absolute; width: 24px; height: 24px; 
            border-radius: 50%; cursor: pointer; z-index: 101;
            box-shadow: 0 0 4px rgba(0,0,0,0.8);
            border: 2px solid white; transform: translate(-50%, -50%);
            display: flex; justify-content: center; align-items: center; font-size: 12px; color: white;
        }
        .img-marker .tooltip {
            visibility: hidden; position: absolute; bottom: 140%; left: 50%; 
            transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; 
            padding: 5px 10px; border-radius: 4px; font-size: 12px; white-space: nowrap; 
            z-index: 102; opacity: 0; transition: 0.2s; pointer-events: none;
        }
        .img-marker:hover .tooltip { visibility: visible; opacity: 1; }
        .m-red { background: #ff3b30; } .m-blue { background: #007aff; } .m-green { background: #34c759; }
        .m-yellow { background: #ffcc00; } .m-black { background: #000000; }

        .marker-popup {
            position: fixed; background: white; padding: 15px; border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3); z-index: 10005;
            display: none; flex-direction: column; gap: 10px; width: 250px;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
        }

        /* リンク */
        a.wiki-link { color: #0645ad; font-weight: bold; text-decoration: none; cursor: pointer; }
        a.wiki-link:hover { text-decoration: underline; }
        a.ext-link { color: #3366bb; text-decoration: none; }
        a.ext-link::after { content: ' \f35d'; font-family: "Font Awesome 6 Free"; font-weight: 900; font-size: 0.7em; margin-left: 3px; }

        /* エディタ */
        .editor-toolbar {
            background: #f8f9fa; border: 1px solid #ccc; padding: 8px;
            display: flex; gap: 5px; position: sticky; top: 60px; z-index: 900; margin-bottom: 20px;
            flex-wrap: nowrap; align-items: center; overflow-x: auto;
        }
        .t-btn { background: white; border: 1px solid #ccc; padding: 5px 10px; cursor: pointer; border-radius: 3px; white-space: nowrap; }
        .edit-card { border: 1px solid #ddd; padding: 15px; margin-bottom: 15px; background: #fffdf5; border-radius: 8px; position: relative; }
        .edit-area { width: 100%; border: 1px solid #ccc; padding: 10px; box-sizing: border-box; font-family: inherit; font-size: 16px; margin-bottom: 10px; }
        .edit-area-caption { height: 60px; background-color: #f9f9f9; font-size: 14px; }
        .edit-card-handle { cursor: grab; color: #ccc; margin-right: 10px; font-size: 20px; float: right; }

        /* Home Grid */
        .home-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 30px; }
        .page-card { border: 1px solid #ddd; border-radius: 8px; overflow: hidden; background: white; cursor: pointer; transition: transform 0.2s; position: relative; }
        .page-card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .card-img { width: 100%; height: 150px; object-fit: cover; background: #eee; }
        .card-body { padding: 15px; text-align: center; font-family: 'Cinzel', serif; font-weight: bold; color: var(--disney-blue); }
        
        .card-delete-btn {
            position: absolute; top: 5px; right: 5px; background: rgba(255,255,255,0.8);
            border: 1px solid #d9534f; color: #d9534f; border-radius: 50%; width: 25px; height: 25px;
            display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 10;
        }

        .btn-royal { background: var(--disney-blue); color: white; border: none; padding: 10px 25px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-magic-save { background-color: var(--disney-gold); color: white; border: none; padding: 8px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-magic-back { background-color: #ccc; color: white; border: none; padding: 8px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .hidden { display: none !important; }
        .btn-auto-link { background: linear-gradient(to right, #8e2de2, #4a00e0); color: white; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; margin-bottom: 20px; width: 100%; box-shadow: 0 4px 10px rgba(74, 0, 224, 0.3); }
    </style>
</head>
<body>
    <div id="media-modal" class="modal">
        <div class="modal-close" onclick="app.closeModal()">×</div>
        <div class="modal-container" id="modal-container">
            <div id="modal-content-wrapper" class="modal-content-wrapper">
                <div id="media-inner" style="position: relative; display: inline-block;"></div>
            </div>
        </div>
        <div id="marker-popup" class="marker-popup">
            <h4>マーカー設定</h4>
            <div class="marker-colors" id="marker-color-select">
                <div class="color-opt m-red selected" data-color="m-red" style="width:20px;height:20px;border-radius:50%;background:#ff3b30;cursor:pointer;"></div>
                <div class="color-opt m-blue" data-color="m-blue" style="width:20px;height:20px;border-radius:50%;background:#007aff;cursor:pointer;"></div>
                <div class="color-opt m-green" data-color="m-green" style="width:20px;height:20px;border-radius:50%;background:#34c759;cursor:pointer;"></div>
            </div>
            <input type="text" id="marker-name-input" placeholder="名前 (例: 隠れミッキー)" style="padding:5px;">
            <div style="display:flex; justify-content:flex-end; gap:5px; margin-top:5px;">
                <button onclick="app.cancelMarker()">キャンセル</button>
                <button onclick="app.confirmMarker()" style="background:var(--disney-blue); color:white; border:none; padding:5px 10px;">決定</button>
            </div>
        </div>
    </div>

    <header>
        <div class="logo-container" onclick="app.goHome()">
            <img src="https://fontmeme.com/permalink/260204/eabb3794.png" alt="DISNEY WIKI" class="logo-img">
        </div>
        <div class="search-container">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="search-input" placeholder="Wiki内を検索..." oninput="app.searchLive(this.value)">
            </div>
            <div id="search-results" class="search-results"></div>
        </div>
        <button id="auth-btn" class="btn-royal" style="background: var(--disney-gold); color: #000;">ログイン</button>
    </header>

    <div class="wrapper">
        <aside class="sidebar">
            <div style="font-weight:bold; border-bottom:1px solid var(--disney-gold); margin-bottom:10px;">目次</div>
            <ul id="toc-list" style="list-style:none; padding:0; font-size:14px;"></ul>
            <button onclick="app.createNewPage()" style="margin-top:30px; cursor:pointer; border:1px dashed var(--disney-gold); padding:10px; background:none; width:100%; color: var(--disney-blue);">+ 新規ページ作成</button>
        </aside>

        <main class="main-content">
            <div id="view-mode">
                <div class="page-header" id="page-header-area">
                    <h1 id="display-title" style="font-family:'Cinzel',serif; font-size:2.5em; margin:0;"></h1>
                    <button id="edit-toggle-btn" class="btn-royal" onclick="app.toggleEdit()" style="background:none; border:1px solid #ccc; color:#666;">このページを編集 ✎</button>
                </div>
                
                <div id="home-view" class="hidden">
                    <button class="btn-auto-link" onclick="app.autoLinkAllPages()">🔗 全Wiki自動リンク結合（魔法）</button>
                    <div id="home-grid" class="home-grid"></div>
                </div>

                <div id="page-content"></div>
            </div>

            <div id="edit-mode" class="hidden">
                <div class="editor-toolbar">
                    <button class="t-btn" onclick="editor.addBlock('section')"><i class="fas fa-heading"></i> 見出し</button>
                    <button class="t-btn" onclick="editor.addBlock('image')"><i class="fas fa-image"></i> 画像</button>
                    <button class="t-btn" onclick="editor.addBlock('pdf')"><i class="fas fa-file-pdf"></i> PDF</button>
                    <button class="t-btn" onclick="editor.addBlock('video')"><i class="fas fa-video"></i> 動画</button>
                    <button class="t-btn" onclick="editor.addBlock('table')"><i class="fas fa-table"></i> 表</button>
                    <button class="t-btn" onclick="editor.addBlock('timeline')"><i class="fas fa-history"></i> 時系列</button>
                    <div style="flex-grow:1;"></div> 
                    <button class="btn-magic-save" onclick="app.savePage()">✨ 保存</button>
                    <button class="btn-magic-back" onclick="app.toggleEdit()">戻る</button>
                </div>

                <div class="edit-card" style="border: 2px solid var(--disney-blue);">
                    <h4 style="margin:0 0 10px 0;">✨ 基本設定</h4>
                    <span id="edit-title-display" style="font-weight:bold; font-size:1.2em;"></span>
                    <div style="margin:10px 0;">
                        <label>サブタイトル (検索用):</label>
                        <input type="text" id="edit-subtitles" class="edit-area" placeholder="カンマ区切り">
                        <label>概要文:</label>
                        <textarea id="edit-summary" class="edit-area" style="height:80px;"></textarea>
                        <label>インフォ画像URL:</label>
                        <input type="text" id="edit-ib-img" class="edit-area">
                    </div>
                    <div id="ib-rows-container"></div>
                    <button onclick="editor.addIbRow()">+ データ項目追加</button>
                </div>
                <div id="editor-blocks-list"></div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBXGAvYQnGZGIALlfsE93C4vBMR41Lp6QA",
            authDomain: "disney-wiki-b76e8.firebaseapp.com",
            projectId: "disney-wiki-b76e8",
            storageBucket: "disney-wiki-b76e8.firebasestorage.app",
            messagingSenderId: "929516211078",
            appId: "1:929516211078:web:a9c5b3a32a9a9c089e3a07"
        };

        const fApp = initializeApp(firebaseConfig);
        const auth = getAuth(fApp);
        const db = getFirestore(fApp);
        const provider = new GoogleAuthProvider();

        const DEFAULT_IMG = "https://ure.pia.co.jp/articles/gallery/1260616?img=61a41e3b7765619450150000";

        window.app = {
            currentPageId: 'home',
            currentUser: null,
            data: {}, 
            allPageCache: [], 
            mediaState: { scale: 1, translateX: 0, translateY: 0 },

            async init() {
                onAuthStateChanged(auth, (user) => {
                    this.currentUser = user;
                    document.getElementById('auth-btn').textContent = user ? 'ログアウト' : 'ログイン';
                });
                
                // ブラウザの戻るボタン対応
                window.onpopstate = (event) => {
                    const pageId = event.state ? event.state.id : 'home';
                    this.loadPage(pageId, false);
                };

                await this.refreshPageCache();
                this.loadPage('home', false);
            },

            async refreshPageCache() {
                const snap = await getDocs(collection(db, "pages"));
                this.allPageCache = [];
                snap.forEach(d => {
                    const data = d.data();
                    this.allPageCache.push({
                        id: d.id,
                        subtitles: data.subtitles || [],
                        img: data.infobox?.image || '',
                        order: data.homeOrder ?? 9999
                    });
                });
            },

            async loadPage(pageId, pushHistory = true) {
                this.currentPageId = pageId;
                if(pushHistory) history.pushState({id: pageId}, "", `#${pageId}`);

                document.getElementById('view-mode').classList.remove('hidden');
                document.getElementById('edit-mode').classList.add('hidden');
                window.scrollTo(0,0);

                if(pageId === 'home') {
                    document.getElementById('display-title').style.display = 'none';
                    document.getElementById('page-content').innerHTML = '';
                    document.getElementById('home-view').classList.remove('hidden');
                    document.getElementById('edit-toggle-btn').classList.add('hidden');
                    this.renderHomeGrid();
                    return;
                }

                document.getElementById('display-title').style.display = 'block';
                document.getElementById('home-view').classList.add('hidden');
                document.getElementById('edit-toggle-btn').classList.remove('hidden');

                const docSnap = await getDoc(doc(db, "pages", pageId));
                if (docSnap.exists()) {
                    this.data = docSnap.data();
                    document.getElementById('display-title').innerText = pageId;
                    this.renderPageContent(this.data);
                } else {
                    document.getElementById('display-title').innerText = pageId + " (未作成)";
                    document.getElementById('page-content').innerHTML = '<p>新しい冒険を書き始めましょう。</p>';
                }
            },

            renderHomeGrid() {
                const grid = document.getElementById('home-grid');
                grid.innerHTML = '';
                let pages = [...this.allPageCache].sort((a,b) => a.order - b.order);

                pages.forEach(p => {
                    if(p.id === 'home') return;
                    const div = document.createElement('div');
                    div.className = 'page-card';
                    div.setAttribute('data-id', p.id);
                    
                    const imgUrl = p.img || DEFAULT_IMG; // 画像がない場合は指定のデフォルトを表示
                    div.innerHTML = `
                        <img src="${imgUrl}" class="card-img">
                        <div class="card-body">${p.id}</div>
                        <div class="card-delete-btn" onclick="event.stopPropagation(); app.deletePageConfirm('${p.id}')">×</div>
                    `;
                    div.onclick = () => this.loadPage(p.id);
                    grid.appendChild(div);
                });

                new Sortable(grid, {
                    animation: 150,
                    onEnd: async () => {
                        const newOrderIds = Array.from(grid.children).map(c => c.getAttribute('data-id'));
                        for(let i=0; i<newOrderIds.length; i++) {
                            await setDoc(doc(db, "pages", newOrderIds[i]), { homeOrder: i }, { merge: true });
                        }
                    }
                });
            },

            async deletePageConfirm(id) {
                if(confirm(`「${id}」を消去しますか？`)) {
                    await deleteDoc(doc(db, "pages", id));
                    await this.refreshPageCache();
                    this.renderHomeGrid();
                }
            },

            renderPageContent(data) {
                const container = document.getElementById('page-content');
                container.innerHTML = '';
                const toc = document.getElementById('toc-list');
                toc.innerHTML = '';

                // インフォボックス描画
                const intro = document.createElement('div');
                intro.className = 'intro-container';
                let ibHtml = `<div class="infobox"><div class="infobox-head">${this.currentPageId}</div>`;
                if(data.infobox?.image) ibHtml += `<img src="${data.infobox.image}">`;
                ibHtml += '<table>';
                data.infobox?.rows?.forEach(r => {
                    ibHtml += `<tr><th>${r.key}</th><td>${this.processLink(r.val)}</td></tr>`;
                });
                ibHtml += '</table></div>';
                
                intro.innerHTML = `<div class="fixed-summary">${this.processLink(data.summary || '')}</div>` + ibHtml;
                container.appendChild(intro);

                // 各ブロック描画
                data.blocks?.forEach((b, i) => {
                    const div = document.createElement('div');
                    div.className = 'content-block';
                    div.id = `block-${i}`;
                    
                    if(b.type === 'section') {
                        div.innerHTML = `<h2>${b.title}</h2><p>${this.processLink(b.text)}</p>`;
                        const li = document.createElement('li');
                        li.innerHTML = `<a class="wiki-link" onclick="document.getElementById('block-${i}').scrollIntoView()">${b.title}</a>`;
                        toc.appendChild(li);
                    } else if(b.type === 'image' || b.type === 'pdf' || b.type === 'video') {
                        const icon = b.type === 'image' ? 'fa-image' : (b.type === 'pdf' ? 'fa-file-pdf' : 'fa-play-circle');
                        div.innerHTML = `
                            <h3>${b.title || 'メディア'}</h3>
                            <div class="media-box" onclick='app.openMedia("${b.type}", "${b.url}")'>
                                <i class="fas ${icon}" style="font-size:30px; color:var(--disney-blue);"></i>
                                <div class="media-title">クリックして表示</div>
                                ${b.description ? `<div class="media-caption">${this.processLink(b.description)}</div>` : ''}
                            </div>
                        `;
                    } else if(b.type === 'table') {
                        let tbl = `<div class="wiki-table-container"><table class="wiki-table">`;
                        b.data.forEach((row, ri) => {
                            tbl += '<tr>';
                            row.forEach(cell => tbl += `<${ri===0?'th':'td'}>${this.processLink(cell)}</${ri===0?'th':'td'}>`);
                            tbl += '</tr>';
                        });
                        div.innerHTML = `<h3>${b.title}</h3>${tbl}</table></div>`;
                    }
                    container.appendChild(div);
                });
            },

            processLink(text) {
                return text.replace(/\[\[(.*?)\]\]/g, (m, p1) => `<a class="wiki-link" onclick="app.loadPage('${p1}')">${p1}</a>`);
            },

            toggleEdit() {
                const isView = document.getElementById('edit-mode').classList.contains('hidden');
                if(isView) {
                    document.getElementById('view-mode').classList.add('hidden');
                    document.getElementById('edit-mode').classList.remove('hidden');
                    this.setupEditor();
                } else {
                    this.loadPage(this.currentPageId, false);
                }
            },

            setupEditor() {
                document.getElementById('edit-title-display').innerText = this.currentPageId;
                document.getElementById('edit-subtitles').value = (this.data.subtitles || []).join(', ');
                document.getElementById('edit-summary').value = this.data.summary || '';
                document.getElementById('edit-ib-img').value = this.data.infobox?.image || '';
                
                const rowsCont = document.getElementById('ib-rows-container');
                rowsCont.innerHTML = '';
                this.data.infobox?.rows?.forEach(r => editor.addIbRow(r.key, r.val));

                const blockCont = document.getElementById('editor-blocks-list');
                blockCont.innerHTML = '';
                this.data.blocks?.forEach(b => editor.renderEditBlock(b));
                
                new Sortable(blockCont, { handle: '.edit-card-handle', animation: 150 });
            },

            async savePage() {
                const blocks = editor.getBlocksFromDOM();
                const subtitles = document.getElementById('edit-subtitles').value.split(',').map(s => s.trim());
                const saveData = {
                    summary: document.getElementById('edit-summary').value,
                    infobox: {
                        image: document.getElementById('edit-ib-img').value,
                        rows: Array.from(document.querySelectorAll('.ib-row')).map(r => ({
                            key: r.querySelector('.ib-k').value,
                            val: r.querySelector('.ib-v').value
                        }))
                    },
                    blocks: blocks,
                    subtitles: subtitles,
                    updatedAt: new Date()
                };
                await setDoc(doc(db, "pages", this.currentPageId), saveData, { merge: true });
                alert("魔法が保存されました✨");
                this.refreshPageCache();
                this.toggleEdit();
            },

            goHome() { this.loadPage('home'); },

            openMedia(type, url) {
                const modal = document.getElementById('media-modal');
                const inner = document.getElementById('media-inner');
                inner.innerHTML = '';
                if(type === 'image') inner.innerHTML = `<img src="${url}" class="view-media">`;
                else if(type === 'pdf') inner.innerHTML = `<iframe src="${url}" class="pdf-frame"></iframe>`;
                else if(type === 'video') inner.innerHTML = `<video src="${url}" controls class="video-frame"></video>`;
                
                modal.classList.add('active');
                document.body.classList.add('noscroll');
            },

            closeModal() {
                document.getElementById('media-modal').classList.remove('active');
                document.body.classList.remove('noscroll');
            },

            createNewPage() {
                const name = prompt("新しいWikiページの名前を入力してください:");
                if(name) this.loadPage(name);
            }
        };

        window.editor = {
            // 文字が消えないように、追加前に現在の状態を一時的にデータへ同期する
            syncCurrentState() {
                app.data.blocks = this.getBlocksFromDOM();
            },

            addBlock(type) {
                this.syncCurrentState(); // 現在の入力を保存
                const newBlock = { type: type, title: '', text: '', url: '', description: '', data: [['','']] };
                app.data.blocks.push(newBlock);
                this.refreshEditBlocks();
            },

            refreshEditBlocks() {
                const cont = document.getElementById('editor-blocks-list');
                cont.innerHTML = '';
                app.data.blocks.forEach(b => this.renderEditBlock(b));
            },

            renderEditBlock(b) {
                const cont = document.getElementById('editor-blocks-list');
                const div = document.createElement('div');
                div.className = 'edit-card block-item';
                div.setAttribute('data-type', b.type);
                
                let html = `<div class="edit-card-handle">☰</div><h4 style="color:var(--disney-gold)">${b.type.toUpperCase()}</h4>`;
                html += `<input type="text" class="edit-area b-title" placeholder="見出し・タイトル" value="${b.title || ''}">`;
                
                if(b.type === 'section') {
                    html += `<textarea class="edit-area b-text" style="height:100px;">${b.text || ''}</textarea>`;
                } else if(b.type === 'image' || b.type === 'pdf' || b.type === 'video') {
                    html += `<input type="text" class="edit-area b-url" placeholder="URL" value="${b.url || ''}">`;
                    html += `<textarea class="edit-area edit-area-caption b-desc" placeholder="メディアの説明文（キャプション）を追加...">${b.description || ''}</textarea>`;
                } else if(b.type === 'table') {
                    html += `<p>※表の編集は保存後反映されます（簡易版）</p>`;
                }
                
                html += `<button class="btn-danger" onclick="this.parentElement.remove()">削除</button>`;
                div.innerHTML = html;
                cont.appendChild(div);
            },

            getBlocksFromDOM() {
                return Array.from(document.querySelectorAll('.block-item')).map(el => ({
                    type: el.getAttribute('data-type'),
                    title: el.querySelector('.b-title')?.value || '',
                    text: el.querySelector('.b-text')?.value || '',
                    url: el.querySelector('.b-url')?.value || '',
                    description: el.querySelector('.b-desc')?.value || '',
                    data: [['見出し1','見出し2'],['データ1','データ2']] // テーブル用ダミー
                }));
            },

            addIbRow(k='', v='') {
                const cont = document.getElementById('ib-rows-container');
                const div = document.createElement('div');
                div.className = 'ib-row';
                div.style.display = 'flex'; div.style.gap = '5px'; div.style.marginBottom = '5px';
                div.innerHTML = `<input type="text" class="ib-k" value="${k}" style="width:40%"> <input type="text" class="ib-v" value="${v}" style="width:50%"> <button onclick="this.parentElement.remove()">×</button>`;
                cont.appendChild(div);
            }
        };

        app.init();
    </script>
</body>
</html>
