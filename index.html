<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disney Wiki - Royal Magical Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --disney-blue: #1e366e;
            --disney-gold: #c5a059;
            --bg-color: #f4f5f7;
            --sidebar-bg: #fbfbfb;
        }

        body { 
            font-family: 'Noto Serif JP', serif; 
            background-color: var(--bg-color); 
            margin: 0; 
            color: #202122; 
            position: relative; 
            overflow-x: hidden; 
        }
        
        body.noscroll { overflow: hidden; }

        header {
            background: linear-gradient(135deg, var(--disney-blue), #0d1b38);
            color: white; padding: 10px 30px; border-bottom: 3px solid var(--disney-gold);
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000;
        }
        
        .logo-container {
            display: flex; align-items: center; gap: 10px; cursor: pointer;
            text-decoration: none;
        }
        .logo-img { height: 45px; display: block; filter: brightness(0) invert(1); }

        .search-container { position: relative; width: 300px; }
        .search-box { position: relative; display: flex; align-items: center; }
        .search-box i { position: absolute; left: 12px; color: var(--disney-blue); }
        .search-box input { width: 100%; padding: 8px 10px 8px 35px; border-radius: 20px; border: 1px solid var(--disney-gold); outline: none; }
        
        .wrapper { display: flex; max-width: 1400px; margin: 20px auto; background: white; min-height: 90vh; box-shadow: 0 0 20px rgba(0,0,0,0.1); position: relative; z-index: 1; }
        .sidebar { width: 280px; padding: 20px; background: var(--sidebar-bg); border-right: 1px solid #eee; }
        .main-content { flex: 1; padding: 40px; box-sizing: border-box; }

        .page-header { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid #aaa; margin-bottom: 20px; padding-bottom: 10px; }
        .intro-container { display: flex; gap: 30px; margin-bottom: 30px; align-items: flex-start; }
        .fixed-summary { flex: 1; font-size: 1.1em; line-height: 1.8; white-space: pre-wrap; word-break: break-all; }
        .infobox { width: 320px; border: 1px solid #aaa; background: #fff; padding: 5px; font-size: 90%; flex-shrink: 0; }
        .infobox-head { background: var(--disney-blue); color: white; text-align: center; padding: 10px; font-weight: bold; }
        .infobox img { width: 100%; border-bottom: 1px solid #eee; }
        .infobox table { width: 100%; border-collapse: collapse; }
        .infobox th { background: #f2f2f2; text-align: left; padding: 8px; width: 35%; border-bottom: 1px solid #eee; }
        .infobox td { padding: 8px; border-bottom: 1px solid #eee; }

        h2 { border-bottom: 1px solid #aaa; color: var(--disney-blue); margin-top: 40px; padding-bottom: 5px; font-size: 1.8em; clear: both; }
        h3 { color: var(--disney-blue); margin-top: 25px; font-size: 1.4em; border-bottom: 1px dashed #ccc; }

        .display-img, .display-gif { max-width: 100%; border-radius: 8px; cursor: pointer; transition: 0.3s; margin-bottom: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .display-img:hover { opacity: 0.9; transform: scale(1.01); }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; margin-bottom: 20px; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 8px; }

        .timeline-box { border-left: 3px solid var(--disney-gold); margin: 20px 0; padding-left: 20px; }
        .timeline-row { display: flex; margin-bottom: 15px; align-items: flex-start; }
        .tl-date { width: 120px; font-weight: bold; color: var(--disney-blue); flex-shrink: 0; font-size: 0.9em; }
        .tl-event { flex: 1; background: #f9f9f9; padding: 10px; border-radius: 5px; }

        .wiki-table { width: 100%; border-collapse: collapse; margin: 15px 0; }
        .wiki-table th, .wiki-table td { border: 1px solid #ccc; padding: 10px; }
        .wiki-table th { background: #f4f4f4; }

        .editor-toolbar { background: #f8f9fa; border: 1px solid #ccc; padding: 10px; display: flex; gap: 8px; position: sticky; top: 65px; z-index: 900; margin-bottom: 20px; flex-wrap: wrap; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .t-btn { background: white; border: 1px solid #ccc; padding: 6px 10px; cursor: pointer; border-radius: 4px; font-size: 13px; display: flex; align-items: center; gap: 5px; }
        .t-btn:hover { background: #eee; }
        .t-btn.format-btn { font-weight: bold; border-color: var(--disney-blue); color: var(--disney-blue); }
        
        .edit-card { border: 1px solid #ddd; padding: 20px; margin-bottom: 20px; background: #fffdf5; border-radius: 8px; position: relative; }
        .edit-area { width: 100%; border: 1px solid #ccc; padding: 10px; box-sizing: border-box; font-size: 15px; margin-top: 5px; }
        .edit-card-handle { cursor: grab; color: var(--disney-gold); float: right; font-size: 24px; }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 99999; display: none; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-close { position: absolute; top: 20px; right: 30px; color: white; font-size: 40px; cursor: pointer; }
        .view-media { max-width: 90vw; max-height: 90vh; }

        .home-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 30px; }
        .page-card { border: 1px solid #ddd; border-radius: 8px; overflow: hidden; background: white; cursor: pointer; transition: 0.2s; position: relative; }
        .page-card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .card-img { width: 100%; height: 150px; object-fit: cover; background: #eee; }
        .card-body { padding: 15px; text-align: center; font-family: 'Cinzel', serif; font-weight: bold; color: var(--disney-blue); }
        
        .btn-magic-save { background: var(--disney-gold); color: white; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .btn-auto-link { background: linear-gradient(to right, #8e2de2, #4a00e0); color: white; border: none; padding: 12px; border-radius: 25px; font-weight: bold; cursor: pointer; margin-bottom: 20px; width: 100%; }
        
        a.wiki-link { color: #0645ad; font-weight: bold; text-decoration: none; cursor: pointer; }
        a.wiki-link:hover { text-decoration: underline; }
        
        .hidden { display: none !important; }

        .btn-delete { background: none; border: 1px solid #dc3545; color: #dc3545; cursor: pointer; padding: 5px 10px; border-radius: 4px; display: flex; align-items: center; gap: 5px; font-size: 13px; }
        .btn-delete:hover { background: #dc3545; color: white; }

        /* 新機能用のスタイル */
        .table-controls { display: flex; gap: 5px; margin-bottom: 10px; background: #eee; padding: 5px; border-radius: 4px; }
        .table-editor-cell { border: 1px solid #ccc; padding: 5px; min-width: 50px; }
    </style>
</head>
<body onload="app.init()">
    <div id="media-modal" class="modal" onclick="app.closeModal()">
        <div class="modal-close">×</div>
        <img id="modal-img" class="view-media">
    </div>

    <header>
        <div class="logo-container" onclick="app.goHome()">
            <img src="https://fontmeme.com/permalink/260204/eabb3794.png" alt="DISNEY WIKI" class="logo-img">
        </div>
        <div class="search-container">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="search-input" placeholder="Wiki内を検索..." oninput="app.searchLive(this.value)">
            </div>
        </div>
        <button id="auth-btn" onclick="app.handleAuth()" style="background: var(--disney-gold); color: #000; border:none; padding:8px 15px; border-radius:5px; cursor:pointer;">ログイン</button>
    </header>

    <div class="wrapper">
        <aside class="sidebar">
            <div style="font-weight:bold; border-bottom:1px solid var(--disney-gold); margin-bottom:10px;">目次</div>
            <ul id="toc-list" style="list-style:none; padding:0; font-size:14px;"></ul>
            <button onclick="app.createNewPage()" style="margin-top:30px; cursor:pointer; border:1px dashed var(--disney-gold); padding:10px; background:none; width:100%; color: var(--disney-blue);">+ 新規ページ作成</button>
        </aside>

        <main class="main-content">
            <div id="view-mode">
                <div class="page-header" id="page-header-area">
                    <h1 id="display-title" style="font-family:'Cinzel',serif; font-size:2.5em; margin:0;"></h1>
                    <div id="header-btns" style="display:flex; gap:10px;">
                        <button id="edit-toggle-btn" onclick="app.toggleEdit()" style="background:none; border:1px solid #ccc; color:#666; cursor:pointer; padding:5px 10px; border-radius:4px;">このページを編集 ✎</button>
                        <button id="delete-page-btn" class="btn-delete" onclick="app.deleteCurrentPage()"><i class="fas fa-trash"></i> 削除</button>
                    </div>
                </div>
                
                <div id="home-view" class="hidden">
                    <button class="btn-auto-link" onclick="app.autoLinkAllPages()">🔗 全Wiki自動リンク結合（魔法）</button>
                    <div id="home-grid" class="home-grid"></div>
                </div>

                <div id="page-content"></div>
            </div>

            <div id="edit-mode" class="hidden">
                <div class="editor-toolbar">
                    <button class="t-btn format-btn" onclick="editor.insertTag('**')"><i class="fas fa-bold"></i> 太字</button>
                    <button class="t-btn format-btn" onclick="editor.insertTag('*')"><i class="fas fa-italic"></i> 斜線</button>
                    <button class="t-btn format-btn" onclick="editor.insertTag('<u>', '</u>')"><i class="fas fa-underline"></i> 下線</button>
                    <div style="width: 1px; background: #ccc; margin: 0 5px;"></div>
                    <button class="t-btn" onclick="editor.addBlock('section')"><i class="fas fa-heading"></i> 見出し</button>
                    <button class="t-btn" onclick="editor.addBlock('image')"><i class="fas fa-image"></i> 画像</button>
                    <button class="t-btn" onclick="editor.addBlock('gif')"><i class="fas fa-file-video"></i> GIF</button>
                    <button class="t-btn" onclick="editor.addBlock('pdf')"><i class="fas fa-file-pdf"></i> PDF</button>
                    <button class="t-btn" onclick="editor.addBlock('youtube')"><i class="fab fa-youtube"></i> YouTube</button>
                    <button class="t-btn" onclick="editor.addBlock('table')"><i class="fas fa-table"></i> 表</button>
                    <button class="t-btn" onclick="editor.addBlock('timeline')"><i class="fas fa-history"></i> 時系列</button>
                    <div style="flex-grow:1;"></div> 
                    <button class="btn-delete" onclick="app.deleteCurrentPage()"><i class="fas fa-trash"></i> ページ削除</button>
                    <button class="btn-magic-save" onclick="app.savePage()">✨ 保存する</button>
                    <button class="t-btn" onclick="app.toggleEdit()">キャンセル</button>
                </div>

                <div class="edit-card" style="border: 2px solid var(--disney-blue);">
                    <h4 style="margin:0 0 10px 0;">✨ ページ基本設定</h4>
                    <label>概要文 (冒頭の紹介):</label>
                    <textarea id="edit-summary" class="edit-area" style="height:80px;" onfocus="editor.lastFocused = this"></textarea>
                    <label style="margin-top:10px; display:block;">インフォ画像URL:</label>
                    <input type="text" id="edit-ib-img" class="edit-area" placeholder="https://...">
                    <div id="ib-rows-container" style="margin-top:10px;"></div>
                    <button class="t-btn" style="margin-top:10px;" onclick="editor.addIbRow()">+ データ項目を追加</button>
                </div>
                <div id="editor-blocks-list"></div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, getDocs, updateDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBXGAvYQnGZGIALlfsE93C4vBMR41Lp6QA",
            authDomain: "disney-wiki-b76e8.firebaseapp.com",
            projectId: "disney-wiki-b76e8",
            storageBucket: "disney-wiki-b76e8.firebasestorage.app",
            messagingSenderId: "929516211078",
            appId: "1:929516211078:web:a9c5b3a32a9a9c089e3a07"
        };

        const fApp = initializeApp(firebaseConfig);
        const auth = getAuth(fApp);
        const db = getFirestore(fApp);
        const provider = new GoogleAuthProvider();

        const DEFAULT_IMG = "https://urepia.ismcdn.jp/mwimgs/3/4/640m/img_348210b81ef38d1b7f68e044790a9d48105046.jpg";

        window.app = {
            currentPageId: 'home',
            data: {},
            allPageCache: [],
            homeOrder: [],

            async init() {
                onAuthStateChanged(auth, (user) => {
                    this.currentUser = user;
                    document.getElementById('auth-btn').textContent = user ? 'ログアウト' : 'ログイン';
                });
                
                window.addEventListener('popstate', (e) => {
                    const hash = window.location.hash.replace('#', '') || 'home';
                    this.loadPage(hash, false);
                });

                await this.refreshPageCache();
                const hash = window.location.hash.replace('#', '');
                this.loadPage(hash || 'home', false);
            },

            async handleAuth() {
                if(this.currentUser) await signOut(auth);
                else await signInWithPopup(auth, provider);
            },

            async refreshPageCache() {
                const snap = await getDocs(collection(db, "pages"));
                this.allPageCache = [];
                snap.forEach(d => {
                    if(d.id !== '_config') this.allPageCache.push({ id: d.id, ...d.data() });
                });
                
                const configSnap = await getDoc(doc(db, "pages", "_config"));
                if(configSnap.exists()) {
                    this.homeOrder = configSnap.data().homeOrder || [];
                }
            },

            async loadPage(pageId, pushHistory = true) {
                this.currentPageId = decodeURIComponent(pageId);
                if(pushHistory) history.pushState({id: this.currentPageId}, "", `#${this.currentPageId}`);

                document.getElementById('view-mode').classList.remove('hidden');
                document.getElementById('edit-mode').classList.add('hidden');
                window.scrollTo(0,0);

                if(this.currentPageId === 'home') {
                    document.getElementById('display-title').style.display = 'none';
                    document.getElementById('page-content').innerHTML = '';
                    document.getElementById('home-view').classList.remove('hidden');
                    document.getElementById('edit-toggle-btn').classList.add('hidden');
                    document.getElementById('delete-page-btn').classList.add('hidden');
                    this.renderHomeGrid();
                    return;
                }

                document.getElementById('display-title').style.display = 'block';
                document.getElementById('home-view').classList.add('hidden');
                document.getElementById('edit-toggle-btn').classList.remove('hidden');
                document.getElementById('delete-page-btn').classList.remove('hidden');

                const docSnap = await getDoc(doc(db, "pages", this.currentPageId));
                if (docSnap.exists()) {
                    this.data = docSnap.data();
                    document.getElementById('display-title').innerText = this.currentPageId;
                    this.renderPageContent(this.data);
                } else {
                    this.data = { summary: '', infobox: {rows: []}, blocks: [] };
                    document.getElementById('display-title').innerText = this.currentPageId + " (未作成)";
                    document.getElementById('page-content').innerHTML = '<p>ページが存在しません。右上の編集ボタンから作成できます。</p>';
                }
            },

            renderHomeGrid() {
                const grid = document.getElementById('home-grid');
                grid.innerHTML = '';
                
                let sortedPages = [...this.allPageCache];
                if(this.homeOrder.length > 0) {
                    sortedPages.sort((a, b) => {
                        let idxA = this.homeOrder.indexOf(a.id);
                        let idxB = this.homeOrder.indexOf(b.id);
                        if(idxA === -1) idxA = 999;
                        if(idxB === -1) idxB = 999;
                        return idxA - idxB;
                    });
                }

                sortedPages.forEach(p => {
                    const div = document.createElement('div');
                    div.className = 'page-card';
                    div.setAttribute('data-id', p.id);
                    const imgUrl = (p.infobox && p.infobox.image && p.infobox.image.trim() !== "") ? p.infobox.image : DEFAULT_IMG;
                    
                    div.innerHTML = `
                        <button onclick="event.stopPropagation(); app.deletePage('${p.id}')" style="position:absolute; top:8px; right:8px; background:rgba(220,53,69,0.9); color:white; border:none; border-radius:4px; cursor:pointer; font-size:12px; width:26px; height:26px; display:flex; justify-content:center; align-items:center; z-index:10;" title="削除"><i class="fas fa-trash"></i></button>
                        <img src="${imgUrl}" class="card-img"><div class="card-body">${p.id}</div>
                    `;
                    div.onclick = () => this.loadPage(p.id);
                    grid.appendChild(div);
                });

                new Sortable(grid, {
                    animation: 150,
                    ghostClass: 'sortable-ghost',
                    onEnd: async () => {
                        const newOrder = Array.from(grid.querySelectorAll('.page-card')).map(el => el.dataset.id);
                        this.homeOrder = newOrder;
                        await setDoc(doc(db, "pages", "_config"), { homeOrder: newOrder }, { merge: true });
                    }
                });
            },

            renderPageContent(data) {
                const container = document.getElementById('page-content');
                container.innerHTML = '';
                const toc = document.getElementById('toc-list');
                toc.innerHTML = '';

                const intro = document.createElement('div');
                intro.className = 'intro-container';
                let ibHtml = `<div class="infobox"><div class="infobox-head">${this.currentPageId}</div>`;
                if(data.infobox?.image) ibHtml += `<img src="${data.infobox.image}">`;
                ibHtml += '<table>';
                data.infobox?.rows?.forEach(r => {
                    ibHtml += `<tr><th>${r.key}</th><td>${this.parseWiki(r.val)}</td></tr>`;
                });
                ibHtml += '</table></div>';
                
                intro.innerHTML = `<div class="fixed-summary">${this.parseWiki(data.summary || '')}</div>` + ibHtml;
                container.appendChild(intro);

                data.blocks?.forEach((b, i) => {
                    const div = document.createElement('div');
                    div.id = `block-${i}`;
                    if(b.type === 'section') {
                        div.innerHTML = `<h2>${b.title}</h2><p>${this.parseWiki(b.text)}</p>`;
                        const li = document.createElement('li');
                        li.innerHTML = `<a class="wiki-link" onclick="document.getElementById('block-${i}').scrollIntoView()">${b.title}</a>`;
                        toc.appendChild(li);
                    } else if(b.type === 'image' || b.type === 'gif') {
                        div.innerHTML = `<h3>${b.title || ''}</h3><img src="${b.url}" class="display-img" onclick="app.openMedia('${b.url}')"><p style="font-size:0.9em; color:#666;">${this.parseWiki(b.description || '')}</p>`;
                    } else if(b.type === 'pdf') {
                        div.innerHTML = `<h3>${b.title || '資料'}</h3><iframe src="${b.url}" style="width:100%; height:500px; border:1px solid #ccc;"></iframe>`;
                    } else if(b.type === 'youtube') {
                        const vid = b.url.includes('v=') ? b.url.split('v=')[1].split('&')[0] : b.url.split('/').pop();
                        div.innerHTML = `<h3>${b.title || ''}</h3><div class="video-container"><iframe src="https://www.youtube.com/embed/${vid}" frameborder="0" allowfullscreen></iframe></div>`;
                    } else if(b.type === 'table') {
                        let tbl = `<table class="wiki-table">`;
                        b.data.forEach((row, ri) => {
                            tbl += '<tr>';
                            row.forEach(cell => tbl += `<${ri===0?'th':'td'}>${this.parseWiki(cell)}</${ri===0?'th':'td'}>`);
                            tbl += '</tr>';
                        });
                        div.innerHTML = `<h3>${b.title || '情報表'}</h3>${tbl}</table>`;
                    } else if(b.type === 'timeline') {
                        let tl = `<div class="timeline-box">`;
                        b.data.forEach(item => {
                            const dateStr = `${item.year || ''}${item.month ? ' / ' + item.month : ''}`;
                            tl += `<div class="timeline-row"><div class="tl-date">${dateStr}</div><div class="tl-event">${this.parseWiki(item.event)}</div></div>`;
                        });
                        div.innerHTML = `<h3>${b.title || '時系列'}</h3>${tl}</div>`;
                    }
                    container.appendChild(div);
                });
            },

            parseWiki(text) {
                if(!text) return '';
                return text
                    .replace(/\[\[(.*?)\]\]/g, (m, p1) => `<a class="wiki-link" onclick="app.loadPage('${p1}')">${p1}</a>`)
                    .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
                    .replace(/\*(.*?)\*/g, '<i>$1</i>')
                    .replace(/<u>(.*?)<\/u>/g, '<u>$1</u>');
            },

            toggleEdit() {
                const isView = document.getElementById('edit-mode').classList.contains('hidden');
                if(isView) {
                    document.getElementById('view-mode').classList.add('hidden');
                    document.getElementById('edit-mode').classList.remove('hidden');
                    this.setupEditor();
                } else {
                    this.loadPage(this.currentPageId, false);
                }
            },

            setupEditor() {
                document.getElementById('edit-summary').value = this.data.summary || '';
                document.getElementById('edit-ib-img').value = this.data.infobox?.image || '';
                const rowsCont = document.getElementById('ib-rows-container');
                rowsCont.innerHTML = '';
                this.data.infobox?.rows?.forEach(r => editor.addIbRow(r.key, r.val));
                const blockCont = document.getElementById('editor-blocks-list');
                blockCont.innerHTML = '';
                this.data.blocks?.forEach(b => editor.renderEditBlock(b));
                new Sortable(blockCont, { handle: '.edit-card-handle', animation: 150 });
            },

            async savePage() {
                const blocks = editor.getBlocksFromDOM();
                const saveData = {
                    summary: document.getElementById('edit-summary').value,
                    infobox: {
                        image: document.getElementById('edit-ib-img').value,
                        rows: Array.from(document.querySelectorAll('.ib-row')).map(r => ({
                            key: r.querySelector('.ib-k').value,
                            val: r.querySelector('.ib-v').value
                        }))
                    },
                    blocks: blocks,
                    updatedAt: new Date()
                };
                await setDoc(doc(db, "pages", this.currentPageId), saveData, { merge: true });
                alert("保存完了✨");
                await this.refreshPageCache();
                this.toggleEdit();
            },

            async deletePage(pageId) {
                if(!confirm(`本当に「${pageId}」のWikiを完全に削除しますか？\nこの操作は取り消せません。`)) return;
                await deleteDoc(doc(db, "pages", pageId));
                this.homeOrder = this.homeOrder.filter(id => id !== pageId);
                await setDoc(doc(db, "pages", "_config"), { homeOrder: this.homeOrder }, { merge: true });
                
                alert(`「${pageId}」を削除しました。`);
                await this.refreshPageCache();
                
                if(this.currentPageId === pageId || this.currentPageId === 'home') {
                    this.goHome();
                }
            },

            async deleteCurrentPage() {
                await this.deletePage(this.currentPageId);
            },

            async autoLinkAllPages() {
                if(!confirm("全ページの本文からタイトルを探して自動リンク化しますか？")) return;
                const pages = this.allPageCache.map(p => p.id);
                for(let pData of this.allPageCache) {
                    let changed = false;
                    const updateBlock = (text) => {
                        let newText = text;
                        pages.forEach(title => {
                            if(title === pData.id) return;
                            const regex = new RegExp(`(?<!\\[\\[)${title}(?!\\]\\])`, 'g');
                            if(regex.test(newText)) {
                                newText = newText.replace(regex, `[[${title}]]`);
                                changed = true;
                            }
                        });
                        return newText;
                    };
                    if(pData.summary) pData.summary = updateBlock(pData.summary);
                    pData.blocks?.forEach(b => {
                        if(b.text) b.text = updateBlock(b.text);
                        if(b.description) b.description = updateBlock(b.description);
                    });
                    if(changed) await setDoc(doc(db, "pages", pData.id), pData, { merge: true });
                }
                alert("すべてのページに魔法のリンクを繋ぎました！");
                location.reload();
            },

            goHome() { this.loadPage('home'); },
            openMedia(url) {
                document.getElementById('modal-img').src = url;
                document.getElementById('media-modal').classList.add('active');
            },
            closeModal() { document.getElementById('media-modal').classList.remove('active'); },
            createNewPage() {
                const name = prompt("新しいWikiページの名前:");
                if(name) this.loadPage(name);
            },
            
            searchLive(val) {
                if(this.currentPageId !== 'home') {
                    this.loadPage('home', true);
                }
                setTimeout(() => {
                    const term = val.toLowerCase();
                    const cards = document.querySelectorAll('.page-card');
                    cards.forEach(card => {
                        const title = card.getAttribute('data-id').toLowerCase();
                        if(title.includes(term)) {
                            card.style.display = 'block';
                        } else {
                            card.style.display = 'none';
                        }
                    });
                }, 10);
            }
        };

        window.editor = {
            lastFocused: null,
            insertTag(startTag, endTag = startTag) {
                const area = this.lastFocused;
                if(!area) return;
                const start = area.selectionStart;
                const end = area.selectionEnd;
                const text = area.value;
                area.value = text.substring(0, start) + startTag + text.substring(start, end) + endTag + text.substring(end);
                area.focus();
            },
            addBlock(type) {
                const b = { type: type, title: '', text: '', url: '', description: '', data: type === 'table' ? [['項1','項2'],['データ1','データ2']] : (type === 'timeline' ? [{year:'2024', month:'1', event:''}] : []) };
                this.renderEditBlock(b);
            },
            addIbRow(k='', v='') {
                const div = document.createElement('div');
                div.className = 'ib-row';
                div.style = "display:flex; gap:5px; margin-bottom:5px;";
                div.innerHTML = `<input type="text" class="ib-k" value="${k}" placeholder="項目名" style="width:30%"><input type="text" class="ib-v" value="${v}" placeholder="内容" style="width:60%"><button class="t-btn" onclick="this.parentElement.remove()">×</button>`;
                document.getElementById('ib-rows-container').appendChild(div);
            },
            renderEditBlock(b) {
                const cont = document.getElementById('editor-blocks-list');
                const div = document.createElement('div');
                div.className = 'edit-card block-item';
                div.setAttribute('data-type', b.type);
                
                let inner = `<div class="edit-card-handle">☰</div><h4 style="color:var(--disney-gold)">${b.type.toUpperCase()} ブロック</h4>`;
                inner += `<input type="text" class="ed-title edit-area" value="${b.title||''}" placeholder="タイトル・見出し">`;
                
                if(b.type === 'section') {
                    inner += `<textarea class="ed-text edit-area" style="height:100px;" onfocus="editor.lastFocused=this" placeholder="本文を入力...">${b.text||''}</textarea>`;
                } else if(['image','gif','pdf','youtube'].includes(b.type)) {
                    inner += `<input type="text" class="ed-url edit-area" value="${b.url||''}" placeholder="${b.type.toUpperCase()}のURLを入力">`;
                    inner += `<textarea class="ed-desc edit-area" placeholder="キャプション・説明文" onfocus="editor.lastFocused=this">${b.description||''}</textarea>`;
                } else if(b.type === 'table') {
                    inner += `<div class="table-controls">
                        <button class="t-btn" onclick="editor.modifyTable(this, 'row')">+ 行追加</button>
                        <button class="t-btn" onclick="editor.modifyTable(this, 'col')">+ 列追加</button>
                        <span style="font-size:11px; color:#666; margin-left:10px;">※セルを直接編集してください</span>
                    </div>
                    <div class="ed-table-cont" style="overflow-x:auto; margin-top:10px;">
                        <table class="editor-inner-table" style="width:100%; border-collapse:collapse;">`;
                    const tableData = b.data || [['',''],['','']];
                    tableData.forEach(row => {
                        inner += `<tr>`;
                        row.forEach(cell => {
                            inner += `<td><input type="text" class="table-editor-cell" value="${cell}" style="width:90%"></td>`;
                        });
                        inner += `</tr>`;
                    });
                    inner += `</table></div>`;
                } else if(b.type === 'timeline') {
                    inner += `<div class="tl-editor-cont">`;
                    const tlData = b.data || [{year:'', month:'', event:''}];
                    tlData.forEach(item => {
                        inner += `<div class="tl-edit-row" style="display:flex; gap:5px; margin-top:5px;">
                            <input type="text" class="tl-y" placeholder="年" value="${item.year||''}" style="width:60px">
                            <input type="text" class="tl-m" placeholder="月" value="${item.month||''}" style="width:40px">
                            <input type="text" class="tl-e edit-area" placeholder="出来事" value="${item.event||''}" onfocus="editor.lastFocused=this">
                            <button class="t-btn" onclick="this.parentElement.remove()">×</button>
                        </div>`;
                    });
                    inner += `</div><button class="t-btn" style="margin-top:10px;" onclick="editor.addTimelineRow(this)">+ 出来事追加</button>`;
                }
                
                inner += `<button class="btn-delete" style="margin-top:15px;" onclick="this.parentElement.remove()">このブロックを削除</button>`;
                div.innerHTML = inner;
                cont.appendChild(div);
            },

            // 新機能: テーブル操作（行・列追加）
            modifyTable(btn, mode) {
                const table = btn.parentElement.nextElementSibling.querySelector('table');
                if(mode === 'row') {
                    const colCount = table.rows[0].cells.length;
                    const row = table.insertRow();
                    for(let i=0; i<colCount; i++) {
                        row.insertCell().innerHTML = `<input type="text" class="table-editor-cell" value="" style="width:90%">`;
                    }
                } else {
                    for(let i=0; i<table.rows.length; i++) {
                        table.rows[i].insertCell().innerHTML = `<input type="text" class="table-editor-cell" value="" style="width:90%">`;
                    }
                }
            },

            addTimelineRow(btn) {
                const cont = btn.previousElementSibling;
                const div = document.createElement('div');
                div.className = 'tl-edit-row';
                div.style = "display:flex; gap:5px; margin-top:5px;";
                div.innerHTML = `<input type="text" class="tl-y" placeholder="年" style="width:60px"><input type="text" class="tl-m" placeholder="月" style="width:40px"><input type="text" class="tl-e edit-area" placeholder="出来事" onfocus="editor.lastFocused=this"><button class="t-btn" onclick="this.parentElement.remove()">×</button>`;
                cont.appendChild(div);
            },

            getBlocksFromDOM() {
                const blocks = [];
                document.querySelectorAll('.block-item').forEach(el => {
                    const type = el.dataset.type;
                    const block = { type: type, title: el.querySelector('.ed-title').value };
                    
                    if(type === 'section') {
                        block.text = el.querySelector('.ed-text').value;
                    } else if(['image','gif','pdf','youtube'].includes(type)) {
                        block.url = el.querySelector('.ed-url').value;
                        block.description = el.querySelector('.ed-desc').value;
                    } else if(type === 'table') {
                        const rows = [];
                        el.querySelectorAll('tr').forEach(tr => {
                            const rowData = [];
                            tr.querySelectorAll('.table-editor-cell').forEach(input => rowData.push(input.value));
                            if(rowData.length > 0) rows.push(rowData);
                        });
                        block.data = rows;
                    } else if(type === 'timeline') {
                        const items = [];
                        el.querySelectorAll('.tl-edit-row').forEach(row => {
                            items.push({
                                year: row.querySelector('.tl-y').value,
                                month: row.querySelector('.tl-m').value,
                                event: row.querySelector('.tl-e').value
                            });
                        });
                        block.data = items;
                    }
                    blocks.push(block);
                });
                return blocks;
            }
        };
    </script>
</body>
</html>
