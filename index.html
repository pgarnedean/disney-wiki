<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disney Wiki - Royal Magical Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --disney-blue: #1e366e;
            --disney-gold: #c5a059;
            --bg-color: #f4f5f7;
        }

        body { 
            font-family: 'Noto Serif JP', serif; 
            background-color: var(--bg-color); 
            margin: 0; 
            color: #202122; 
            position: relative; 
            overflow-x: hidden; 
        }
        /* モーダル表示中に背景スクロールを止める */
        body.noscroll { overflow: hidden; height: 100vh; }

        /* --- 演出関連 --- */
        #effects-canvas, #fireworks-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
        }
        #effects-canvas { z-index: 9990; }
        #fireworks-canvas { z-index: 9995; }

        header {
            background: linear-gradient(135deg, var(--disney-blue), #0d1b38);
            color: white; padding: 10px 30px; border-bottom: 3px solid var(--disney-gold);
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000;
        }
        
        .logo-container {
            display: flex; align-items: center; gap: 10px; cursor: pointer;
            text-decoration: none;
        }
        .logo-img { height: 45px; display: block; filter: brightness(0) invert(1); }

        .search-container { position: relative; width: 300px; }
        .search-box { position: relative; display: flex; align-items: center; }
        .search-box i { position: absolute; left: 12px; color: var(--disney-blue); }
        .search-box input { width: 100%; padding: 8px 10px 8px 35px; border-radius: 20px; border: 1px solid var(--disney-gold); outline: none; }
        .search-results {
            position: absolute; top: 40px; left: 0; width: 100%; background: white;
            border: 1px solid var(--disney-gold); border-radius: 5px; z-index: 1001; display: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .search-item { padding: 10px; color: #333; cursor: pointer; border-bottom: 1px solid #eee; }
        .search-item:hover { background: #f0f0f0; }

        .wrapper { display: flex; max-width: 1400px; margin: 20px auto; background: white; min-height: 90vh; box-shadow: 0 0 20px rgba(0,0,0,0.1); position: relative; z-index: 1; }
        .sidebar { width: 280px; padding: 20px; background: #fbfbfb; border-right: 1px solid #eee; }
        .main-content { flex: 1; padding: 40px; box-sizing: border-box; }

        /* コンテンツスタイル */
        .page-header { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid #aaa; margin-bottom: 20px; padding-bottom: 10px; }
        .intro-container { display: flex; gap: 30px; margin-bottom: 30px; align-items: flex-start; }
        .fixed-summary { flex: 1; font-size: 1.1em; line-height: 1.8; white-space: pre-wrap; word-break: break-all; }
        .infobox { width: 320px; border: 1px solid #aaa; background: #fff; padding: 5px; font-size: 90%; flex-shrink: 0; }
        .infobox-head { background: var(--disney-blue); color: white; text-align: center; padding: 10px; font-weight: bold; }
        .infobox img { width: 100%; border-bottom: 1px solid #eee; }
        .infobox table { width: 100%; border-collapse: collapse; }
        .infobox th { background: #f2f2f2; text-align: left; padding: 8px; width: 35%; border-bottom: 1px solid #eee; }
        .infobox td { padding: 8px; border-bottom: 1px solid #eee; }

        .content-block { margin-bottom: 30px; }
        h2 { border-bottom: 1px solid #aaa; color: var(--disney-blue); margin-top: 40px; padding-bottom: 5px; font-size: 1.8em; clear: both; }
        h3 { color: var(--disney-blue); margin-top: 25px; font-size: 1.4em; border-bottom: 1px dashed #ccc; }

        .media-box { 
            border: 1px solid #ccc; background: #fafafa; padding: 15px; text-align: center; 
            cursor: pointer; transition: 0.2s; max-width: 100%; border-radius: 4px;
        }
        .media-box:hover { box-shadow: 0 0 10px rgba(0,0,0,0.1); transform: translateY(-2px); }
        .media-preview-img { max-width: 100%; max-height: 300px; object-fit: contain; }
        .media-description { margin-top: 10px; font-size: 0.95em; color: #444; line-height: 1.6; text-align: left; white-space: pre-wrap; }
        
        .timeline-box, .wiki-table-container { 
            border: 2px solid var(--disney-gold); padding: 15px; 
            background: white; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .timeline-row { display: flex; border-bottom: 1px dashed #eee; padding: 8px 0; }
        .tl-year { width: 80px; font-weight: bold; color: var(--disney-blue); flex-shrink: 0; text-align: right; padding-right: 15px; border-right: 2px solid var(--disney-gold); }
        .tl-event { padding-left: 15px; flex: 1; text-align: left; font-size: 0.95em; }

        .wiki-table { width: 100%; border-collapse: collapse; font-size: 14px; background: white; }
        .wiki-table th, .wiki-table td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        .wiki-table th { background: #f0f0f0; font-weight: bold; text-align: center; }

        /* モーダル */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95);
            z-index: 99999; display: none; justify-content: center; align-items: center;
        }
        .modal.active { display: flex; }
        .modal-container {
            width: 100%; height: 100%; position: relative; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }
        .modal-content-wrapper {
            position: relative; transform-origin: center center; transition: transform 0.1s ease-out; 
            user-select: none; display: inline-block; max-height: 100vh;
        }
        .modal-close { 
            position: absolute; top: 20px; right: 30px; color: white; font-size: 40px; 
            cursor: pointer; z-index: 10010; text-shadow: 0 0 5px black; 
        }
        .view-media { display: block; max-width: 95vw; max-height: 95vh; object-fit: contain; }

        /* エディタ */
        .editor-toolbar {
            background: #f8f9fa; border: 1px solid #ccc; padding: 8px;
            display: flex; gap: 5px; position: sticky; top: 60px; z-index: 900; margin-bottom: 20px;
            overflow-x: auto;
        }
        .t-btn { background: white; border: 1px solid #ccc; padding: 5px 10px; cursor: pointer; border-radius: 3px; }
        .edit-card { border: 1px solid #ddd; padding: 15px; margin-bottom: 15px; background: #fffdf5; border-radius: 8px; position: relative; }
        .edit-area { width: 100%; border: 1px solid #ccc; padding: 10px; box-sizing: border-box; font-family: inherit; font-size: 16px; margin-top: 5px; }

        .home-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 30px; }
        .page-card { border: 1px solid #ddd; border-radius: 8px; overflow: hidden; background: white; cursor: pointer; transition: transform 0.2s; position: relative; }
        .page-card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .card-img { width: 100%; height: 150px; object-fit: cover; background: #eee; }
        .card-body { padding: 15px; text-align: center; font-family: 'Cinzel', serif; font-weight: bold; color: var(--disney-blue); }
        .card-delete-btn { position: absolute; top: 5px; right: 5px; background: white; border: 1px solid #d9534f; color: #d9534f; border-radius: 50%; width: 25px; height: 25px; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 10; }

        .btn-royal { background: var(--disney-blue); color: white; border: none; padding: 10px 25px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .hidden { display: none !important; }
        .btn-magic-save { background-color: #c5a059; color: white; border: none; padding: 8px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-magic-back { background-color: #ccc; color: white; border: none; padding: 8px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-auto-link { background: linear-gradient(to right, #8e2de2, #4a00e0); color: white; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; margin-bottom: 20px; width: 100%; }

        /* リンク */
        a.wiki-link { color: #0645ad; font-weight: bold; text-decoration: none; cursor: pointer; }
        a.wiki-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div id="media-modal" class="modal">
        <div class="modal-close" onclick="app.closeModal()">×</div>
        <div class="modal-container">
            <div id="modal-content-wrapper" class="modal-content-wrapper">
                <div id="media-inner"></div>
            </div>
        </div>
    </div>

    <header>
        <div class="logo-container" onclick="app.goHome()">
            <img src="https://fontmeme.com/permalink/260204/eabb3794.png" alt="DISNEY WIKI" class="logo-img">
        </div>
        <div class="search-container">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="search-input" placeholder="Wiki内を検索..." oninput="app.searchLive(this.value)">
            </div>
            <div id="search-results" class="search-results"></div>
        </div>
        <button id="auth-btn" class="btn-royal" style="background: var(--disney-gold); color: #000;">ログイン</button>
    </header>

    <div class="wrapper">
        <aside class="sidebar">
            <div style="font-weight:bold; border-bottom:1px solid var(--disney-gold); margin-bottom:10px;">目次</div>
            <ul id="toc-list" style="list-style:none; padding:0; font-size:14px;"></ul>
            <button onclick="app.createNewPage()" style="margin-top:30px; cursor:pointer; border:1px dashed var(--disney-gold); padding:10px; background:none; width:100%; color: var(--disney-blue);">+ 新規ページ作成</button>
        </aside>

        <main class="main-content">
            <div id="view-mode">
                <div class="page-header">
                    <h1 id="display-title" style="font-family:'Cinzel',serif; font-size:2.5em; margin:0;"></h1>
                    <button class="btn-royal" id="edit-start-btn" onclick="app.toggleEdit()" style="background:none; border:1px solid #ccc; color:#666;">このページを編集 ✎</button>
                </div>
                <div id="home-view" class="hidden">
                    <button class="btn-auto-link" onclick="app.autoLinkAllPages()">🔗 全Wiki自動リンク結合（魔法）</button>
                    <div id="home-grid" class="home-grid"></div>
                </div>
                <div id="page-content"></div>
            </div>

            <div id="edit-mode" class="hidden">
                <div class="editor-toolbar">
                    <button class="t-btn" onclick="editor.addBlock('section')"><i class="fas fa-heading"></i> 見出し</button>
                    <button class="t-btn" onclick="editor.addBlock('image')"><i class="fas fa-image"></i> 画像</button>
                    <button class="t-btn" onclick="editor.addBlock('pdf')"><i class="fas fa-file-pdf"></i> PDF</button>
                    <button class="t-btn" onclick="editor.addBlock('video')"><i class="fas fa-video"></i> 動画</button>
                    <button class="t-btn" onclick="editor.addBlock('table')"><i class="fas fa-table"></i> 表</button>
                    <button class="t-btn" onclick="editor.addBlock('timeline')"><i class="fas fa-history"></i> 時系列</button>
                    <div style="flex-grow:1;"></div>
                    <button class="btn-magic-save" onclick="app.savePage()">✨ 保存</button>
                    <button class="btn-magic-back" onclick="app.toggleEdit()">戻る</button>
                </div>
                <div id="base-edit-area">
                    <div class="edit-card">
                        <label>サブ題名 (カンマ区切り):</label>
                        <input type="text" id="edit-subtitles" class="edit-area">
                        <label style="margin-top:10px; display:block;">概要説明:</label>
                        <textarea id="edit-summary" class="edit-area" style="height:80px;"></textarea>
                        <label style="margin-top:10px; display:block;">インフォ画像URL:</label>
                        <input type="text" id="edit-ib-img" class="edit-area">
                    </div>
                </div>
                <div id="editor-blocks-list"></div>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBXGAvYQnGZGIALlfsE93C4vBMR41Lp6QA",
            authDomain: "disney-wiki-b76e8.firebaseapp.com",
            projectId: "disney-wiki-b76e8",
            storageBucket: "disney-wiki-b76e8.firebasestorage.app",
            messagingSenderId: "929516211078",
            appId: "1:929516211078:web:a9c5b3a32a9a9c089e3a07"
        };

        const fApp = initializeApp(firebaseConfig);
        const auth = getAuth(fApp);
        const db = getFirestore(fApp);
        const provider = new GoogleAuthProvider();

        const DEFAULT_IMG = "https://ure.pia.co.jp/articles/gallery/1260616?img=61a41e3b7765619450150000";

        window.app = {
            currentPageId: 'home',
            data: { blocks: [] },
            allPageCache: [],
            
            async init() {
                onAuthStateChanged(auth, u => {
                    this.currentUser = u;
                    document.getElementById('auth-btn').textContent = u ? 'ログアウト' : 'ログイン';
                });
                document.getElementById('auth-btn').onclick = () => this.currentUser ? signOut(auth) : signInWithPopup(auth, provider);
                
                window.addEventListener('popstate', (e) => {
                    const pid = e.state?.pageId || 'home';
                    this.loadPage(pid, false);
                });

                await this.refreshCache();
                this.loadPage('home', false);
            },

            async refreshCache() {
                const snap = await getDocs(collection(db, "pages"));
                this.allPageCache = [];
                snap.forEach(d => this.allPageCache.push({ id: d.id, ...d.data() }));
            },

            async loadPage(pageId, pushHistory = true) {
                this.currentPageId = pageId;
                if (pushHistory) history.pushState({ pageId }, '', `#${pageId}`);
                
                document.getElementById('view-mode').classList.remove('hidden');
                document.getElementById('edit-mode').classList.add('hidden');
                window.scrollTo(0,0);

                if (pageId === 'home') {
                    this.renderHome();
                    return;
                }

                document.getElementById('home-view').classList.add('hidden');
                document.getElementById('display-title').innerText = pageId;
                document.getElementById('edit-start-btn').classList.remove('hidden');

                const snap = await getDoc(doc(db, "pages", pageId));
                if (snap.exists()) {
                    this.data = snap.data();
                    this.renderContent();
                } else {
                    this.data = { blocks: [], summary: "", subtitles: "" };
                    document.getElementById('page-content').innerHTML = "ページが存在しません。";
                }
            },

            renderHome() {
                document.getElementById('display-title').innerText = "Disney Wiki TOP";
                document.getElementById('edit-start-btn').classList.add('hidden');
                document.getElementById('home-view').classList.remove('hidden');
                document.getElementById('page-content').innerHTML = "";
                
                const grid = document.getElementById('home-grid');
                grid.innerHTML = "";
                this.allPageCache.sort((a,b) => (a.homeOrder||0) - (b.homeOrder||0)).forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'page-card';
                    const img = p.infobox?.image || p.img || DEFAULT_IMG;
                    card.innerHTML = `<img src="${img}" class="card-img"><div class="card-body">${p.id}</div>`;
                    card.onclick = () => this.loadPage(p.id);
                    grid.appendChild(card);
                });
            },

            renderContent() {
                const container = document.getElementById('page-content');
                container.innerHTML = "";
                
                // 概要・インフォ
                const intro = document.createElement('div');
                intro.className = 'intro-container';
                intro.innerHTML = `<div class="fixed-summary">${this.data.summary || ""}</div>`;
                if(this.data.infobox?.image) {
                    intro.innerHTML += `<div class="infobox"><div class="infobox-head">${this.currentPageId}</div><img src="${this.data.infobox.image}"></div>`;
                }
                container.appendChild(intro);

                // 各ブロック
                this.data.blocks.forEach((b, i) => {
                    const div = document.createElement('div');
                    div.className = 'content-block';
                    if (b.type === 'section') {
                        div.innerHTML = `<h2>${b.title}</h2><p style="white-space:pre-wrap;">${b.text}</p>`;
                    } else if (['image', 'pdf', 'video'].includes(b.type)) {
                        const icon = b.type==='pdf'?'fa-file-pdf':(b.type==='video'?'fa-play-circle':'fa-image');
                        div.innerHTML = `<h3>${b.title || ''}</h3>
                            <div class="media-box" onclick="app.openMedia('${b.type}','${b.url}')">
                                ${b.type==='image'?`<img src="${b.url}" class="media-preview-img">`:`<i class="fas ${icon}" style="font-size:40px; color:var(--disney-blue);"></i>`}
                                <div style="font-size:12px; color:#999; margin-top:5px;">クリックして拡大</div>
                                ${b.description ? `<div class="media-description">${b.description}</div>` : ''}
                            </div>`;
                    } else if (b.type === 'table') {
                        div.innerHTML = `<h3>${b.title}</h3><div class="wiki-table-container"><table class="wiki-table">
                            ${b.data.map((r, ri) => `<tr>${r.map(c => `<${ri===0?'th':'td'}>${c}</${ri===0?'th':'td'}>`).join('')}</tr>`).join('')}
                        </table></div>`;
                    }
                    container.appendChild(div);
                });
            },

            toggleEdit() {
                if (this.currentPageId === 'home') return;
                const isView = document.getElementById('edit-mode').classList.contains('hidden');
                if (isView) {
                    document.getElementById('view-mode').classList.add('hidden');
                    document.getElementById('edit-mode').classList.remove('hidden');
                    this.setupEditor();
                } else {
                    this.loadPage(this.currentPageId, false);
                }
            },

            setupEditor() {
                document.getElementById('edit-subtitles').value = this.data.subtitles || "";
                document.getElementById('edit-summary').value = this.data.summary || "";
                document.getElementById('edit-ib-img').value = this.data.infobox?.image || "";
                window.editor.renderBlocks();
            },

            async savePage() {
                window.editor.syncData();
                const updated = {
                    subtitles: document.getElementById('edit-subtitles').value,
                    summary: document.getElementById('edit-summary').value,
                    infobox: { image: document.getElementById('edit-ib-img').value },
                    blocks: this.data.blocks
                };
                await setDoc(doc(db, "pages", this.currentPageId), updated, { merge: true });
                await this.refreshCache();
                this.toggleEdit();
            },

            createNewPage() {
                const name = prompt("新しいページ名を入力してください:");
                if (name) this.loadPage(name);
            },

            goHome() { this.loadPage('home'); },

            openMedia(type, url) {
                const inner = document.getElementById('media-inner');
                inner.innerHTML = "";
                if (type === 'image') inner.innerHTML = `<img src="${url}" class="view-media">`;
                if (type === 'video') inner.innerHTML = `<video src="${url}" controls class="view-media"></video>`;
                if (type === 'pdf') inner.innerHTML = `<iframe src="${url}" style="width:80vw; height:80vh; border:none;"></iframe>`;
                
                document.getElementById('media-modal').classList.add('active');
                document.body.classList.add('noscroll');
            },

            closeModal() {
                document.getElementById('media-modal').classList.remove('active');
                document.body.classList.remove('noscroll');
            }
        };

        window.editor = {
            syncData() {
                const cards = document.querySelectorAll('.edit-card[data-index]');
                const newBlocks = [];
                cards.forEach(card => {
                    const idx = card.getAttribute('data-index');
                    const type = app.data.blocks[idx].type;
                    const block = { type };
                    if (type === 'section') {
                        block.title = card.querySelector('.in-title').value;
                        block.text = card.querySelector('.in-text').value;
                    } else if (['image', 'pdf', 'video'].includes(type)) {
                        block.title = card.querySelector('.in-title').value;
                        block.url = card.querySelector('.in-url').value;
                        block.description = card.querySelector('.in-desc').value;
                    } else if (type === 'table') {
                        block.title = card.querySelector('.in-title').value;
                        block.data = app.data.blocks[idx].data; // 表データはここでは保持のみ
                    }
                    newBlocks.push(block);
                });
                app.data.blocks = newBlocks;
            },

            addBlock(type) {
                this.syncData(); // 現在の内容を保存
                const block = { type, title: "" };
                if (type === 'section') { block.text = ""; }
                else if (['image', 'pdf', 'video'].includes(type)) { block.url = ""; block.description = ""; }
                else if (type === 'table') { block.data = [["列1", "列2"], ["データ1", "データ2"]]; }
                app.data.blocks.push(block);
                this.renderBlocks();
            },

            renderBlocks() {
                const list = document.getElementById('editor-blocks-list');
                list.innerHTML = "";
                app.data.blocks.forEach((b, i) => {
                    const card = document.createElement('div');
                    card.className = 'edit-card';
                    card.setAttribute('data-index', i);
                    
                    let html = `<div style="display:flex; justify-content:space-between;"><b>#${i+1} ${b.type.toUpperCase()}</b> <button onclick="editor.removeBlock(${i})">削除</button></div>`;
                    
                    if (b.type === 'section') {
                        html += `<input type="text" class="edit-area in-title" placeholder="見出し" value="${b.title||''}">
                                 <textarea class="edit-area in-text" placeholder="文章" style="height:100px;">${b.text||''}</textarea>`;
                    } else if (['image', 'pdf', 'video'].includes(b.type)) {
                        html += `<input type="text" class="edit-area in-title" placeholder="タイトルトップ" value="${b.title||''}">
                                 <input type="text" class="edit-area in-url" placeholder="URL (Firebase等)" value="${b.url||''}">
                                 <textarea class="edit-area in-desc" placeholder="画像の下に表示する説明文" style="height:60px;">${b.description||''}</textarea>`;
                    } else if (b.type === 'table') {
                        html += `<input type="text" class="edit-area in-title" placeholder="表のタイトル" value="${b.title||''}">
                                 <p style="font-size:12px; color:#666;">※表の内容編集は本バージョンではJSON直接編集を推奨します</p>`;
                    }
                    card.innerHTML = html;
                    list.appendChild(card);
                });
            },

            removeBlock(idx) {
                this.syncData();
                app.data.blocks.splice(idx, 1);
                this.renderBlocks();
            }
        };

        app.init();
    </script>
</body>
</html>
